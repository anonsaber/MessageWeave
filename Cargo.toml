[package]
name = "message-weave"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
axum = "0.8"
# Already in Cargo.lock as a jmap-client transitive dep; used only for the
# fixed-offset render of notification timestamps. No IANA DB: chrono-tz is not
# available offline, so only no-DST zones are supported (see config.rs).
chrono = "0.4"
# Read-only HTTP JMAP only; keep WebSocket/EventSource out of the dependency graph.
jmap-client = { version = "=0.4.2", default-features = false, features = ["async", "rustls"] }
redis = { version = "0.27", default-features = false, features = ["aio", "tokio-comp", "streams", "script", "tokio-rustls-comp", "connection-manager"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
ring = "0.17.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
