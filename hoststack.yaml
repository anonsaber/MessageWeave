# HostStack native Rust deployment for MessageWeave.
# Set REDIS_URL and CONFIG_ENCRYPTION_KEY as encrypted HostStack dashboard
# secrets; never put their values in this repository.
services:
  web:
    type: web_service
    runtime: rust
    build:
      command: cargo build --release --locked
    start:
      command: ./target/release/message-weave
    healthCheck:
      path: /healthz
      interval: 30
      timeout: 5
